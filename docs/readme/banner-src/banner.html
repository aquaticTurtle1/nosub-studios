<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#0d0a10;--acc:#ff2e93;--acc2:#ff5caa;--t:#f7f0fa;--m:#bdb0c4}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:var(--h,400px);background:var(--bg);color:var(--t);font-family:"Space Grotesk",Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 12% 0%,#ff2e9342,transparent 65%),radial-gradient(600px 400px at 100% 100%,#7a2bff2e,transparent 65%)}
.tiles{position:absolute;right:-40px;top:-60px;bottom:-60px;width:620px;display:flex;gap:18px;transform:rotate(8deg)}
.col{display:flex;flex-direction:column;gap:18px;flex:1}
.col img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:2px solid #3b3143;display:block}
.col:nth-child(2){margin-top:-110px}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 38%,#0d0a10cc 52%,transparent 78%)}
.txt{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:700px}
.k{font-size:20px;letter-spacing:5px;color:var(--acc2);font-weight:600;margin-bottom:18px}
h1{font-size:var(--fs,104px);line-height:.95;letter-spacing:-4px;font-weight:700}
h1 b{color:var(--acc)}
p{margin-top:24px;font-size:var(--ps,28px);color:var(--m);line-height:1.25;max-width:var(--pw,700px)}
.pill{margin-top:var(--pm,28px);align-self:flex-start;background:var(--acc);color:#2a0016;font-weight:700;font-size:22px;padding:10px 22px;border-radius:12px}
</style></head><body>
<div class="glow"></div>
<div class="tiles">
<div class="col"><img src="../gallery-1-portrait.jpg"><img src="../gallery-4-anime.jpg"><img src="../gallery-8-architecture.jpg"></div>
<div class="col"><img src="../gallery-6-fantasy.jpg"><img src="../gallery-3-fashion.jpg"><img src="../gallery-7-food.jpg"></div>
<div class="col"><img src="../gallery-2-product.jpg"><img src="../gallery-5-cinematic.jpg"><img src="../gallery-1-portrait.jpg"></div>
</div>
<div class="fade"></div>
<div class="txt"><div class="k">OPEN-SOURCE AI STUDIO</div><h1>NoSub <b>Studios</b></h1><p>Studio-grade AI images &amp; video. No subscription.</p><div class="pill">Pay per generation</div></div>
<script>
const q=new URLSearchParams(location.search);if(q.get("og")){document.body.style.setProperty("--h","640px");document.body.style.setProperty("--fs","132px");document.body.style.setProperty("--ps","40px");document.body.style.setProperty("--pw","520px");document.body.style.setProperty("--pm","40px");document.querySelector(".tiles").style.width="680px";document.querySelector(".txt").style.width="760px"}
</script></body></html>
