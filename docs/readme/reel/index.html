<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>NoSub Studios reel</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  body{margin:0;background:#0d0a10;font-family:Inter,system-ui,sans-serif;color:#f7f0fa}
  #root{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0a10}
  .bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 20% 10%,#ff2e9333,transparent 60%),radial-gradient(800px 600px at 90% 100%,#7a2bff22,transparent 60%),#0d0a10}
  .clip{position:absolute;inset:0}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center}
  h1{margin:0;font-size:170px;letter-spacing:-6px;font-weight:700;line-height:1}
  h1 b{color:#ff2e93;font-weight:700}
  .sub{margin-top:26px;font-size:46px;color:#bdb0c4}
  .box{width:1500px;border:2px solid #3b3143;background:#1e1824;border-radius:28px;padding:56px 64px;box-shadow:0 0 120px #ff2e9340}
  .lbl{font-size:30px;color:#ff5caa;letter-spacing:4px;margin-bottom:26px;font-weight:600}
  .typed{font-size:60px;line-height:1.3;min-height:160px}
  .caret{display:inline-block;width:6px;height:60px;background:#ff2e93;vertical-align:-8px;margin-left:4px}
  .btn{margin-top:30px;display:inline-block;background:#ff2e93;color:#2a0016;font-weight:700;font-size:34px;padding:16px 38px;border-radius:14px}
  .wrapabs{position:absolute;inset:0}
  .vwrap{position:absolute;inset:0;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:absolute;z-index:5;left:64px;bottom:60px;background:#0d0a10cc;border:2px solid #3b3143;border-radius:16px;padding:16px 28px;font-size:36px}
  .tag i{font-style:normal;color:#ff5caa}
  .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .cell{overflow:hidden}
  .pill{display:inline-block;margin-top:34px;border:2px solid #ff2e93;color:#ff5caa;font-size:40px;padding:12px 34px;border-radius:999px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10.2">
  <div class="bg"></div>

  <section id="s-title" class="clip center" data-start="0" data-duration="1.4">
    <h1 id="t-name">NoSub <b>Studios</b></h1>
    <div class="sub" id="t-sub">Studio-grade AI images &amp; video.</div>
  </section>

  <section id="s-prompt" class="clip center" data-start="1.3" data-duration="1.4">
    <div class="box" id="p-box">
      <div class="lbl">PROMPT</div>
      <div class="typed"><span id="p-text"></span><span class="caret" id="p-caret"></span></div>
      <div class="btn" id="p-btn">Generate</div>
    </div>
  </section>

  <div id="w-whale" class="wrapabs"><div class="vwrap"><video id="v-whale" src="assets/whale.mp4" muted playsinline data-start="2.6" data-duration="1.7"></video></div></div>
  <div id="g1" class="clip tagc" data-start="2.6" data-duration="1.7"><div class="tag">Wan 3.0 <i>&middot;</i> 16 credits/s</div></div>
  <div id="w-splash" class="wrapabs"><div class="vwrap"><video id="v-splash" src="assets/splash.mp4" muted playsinline data-start="4.3" data-duration="1.7"></video></div></div>
  <div id="g2" class="clip tagc" data-start="4.3" data-duration="1.7"><div class="tag">Wan 3.0 <i>&middot;</i> 16 credits/s</div></div>
  <div id="w-hum" class="wrapabs"><div class="vwrap"><video id="v-hum" src="assets/hummingbird.mp4" muted playsinline data-start="6.0" data-duration="1.7"></video></div></div>
  <div id="g3" class="clip tagc" data-start="6.0" data-duration="1.7"><div class="tag">Image to video <i>&middot;</i> Wan 3.0</div></div>

  <section id="s-gal" class="clip" data-start="7.7" data-duration="1.0">
    <div class="grid">
      <div class="cell"><img id="i1" src="assets/gallery-1-portrait.jpg"/></div>
      <div class="cell"><img id="i2" src="assets/gallery-3-fashion.jpg"/></div>
      <div class="cell"><img id="i3" src="assets/gallery-6-fantasy.jpg"/></div>
      <div class="cell"><img id="i4" src="assets/gallery-7-food.jpg"/></div>
    </div>
  </section>

  <section id="s-end" class="clip center" data-start="8.7" data-duration="1.5">
    <div class="bg"></div>
    <h1 id="e-h" style="font-size:120px;position:relative">No subscription.</h1>
    <div class="sub" id="e-s" style="font-size:80px;color:#ff5caa;position:relative;margin-top:10px">Pay per generation.</div>
    <div class="pill" id="e-p" style="position:relative">NoSub Studios</div>
  </section>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// title
tl.from("#t-name",{y:60,opacity:0,duration:.5,ease:"power3.out"},0.1);
tl.from("#t-sub",{y:30,opacity:0,duration:.4,ease:"power2.out"},0.4);
tl.to("#s-title",{opacity:0,duration:.15},1.25);
// prompt
const full="A colossal whale gliding through golden sunset clouds above a futuristic city";
const o={n:0};
tl.from("#p-box",{y:40,opacity:0,scale:.96,duration:.3,ease:"power3.out"},1.3);
tl.to(o,{n:full.length,duration:.85,ease:"none",onUpdate:()=>{document.getElementById("p-text").textContent=full.slice(0,Math.round(o.n));}},1.45);
tl.fromTo("#p-btn",{scale:1},{scale:1.08,duration:.1,yoyo:true,repeat:1},2.4);
tl.to("#s-prompt",{opacity:0,duration:.15},2.55);
// clips
[["#w-whale","#v-whale","#g1",2.6],["#w-splash","#v-splash","#g2",4.3],["#w-hum","#v-hum","#g3",6.0]].forEach(([s,v,g,t])=>{
  tl.fromTo(s,{opacity:0},{opacity:1,duration:.12},t);
  tl.fromTo(s+" .vwrap",{scale:1.0},{scale:1.08,duration:1.7,ease:"none"},t);
  tl.from(g+" .tag",{x:-40,opacity:0,duration:.35,ease:"power3.out"},t+.25);
});
// gallery flash
["#i1","#i2","#i3","#i4"].forEach((id,k)=>{tl.from(id,{scale:1.25,opacity:0,duration:.3,ease:"power3.out"},7.7+k*.12);});
// end
tl.from("#e-h",{y:40,opacity:0,duration:.35,ease:"power3.out"},8.8);
tl.from("#e-s",{y:30,opacity:0,duration:.35,ease:"power3.out"},9.0);
tl.from("#e-p",{scale:.8,opacity:0,duration:.3,ease:"back.out(2)"},9.25);
window.__timelines["main"] = tl;
</script>
</body>
</html>
